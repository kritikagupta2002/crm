name: Production CD (Auto Deploy to Server)

on:
  push:
    branches:
      - prod

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    steps:
      - name: Executing remote SSH deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Auto-deploy triggered for commit: $GITHUB_SHA"
            
            DEPLOY_DIR="/var/www/bansalgeo-hrms"
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "Target directory $DEPLOY_DIR not found, please ensure project is cloned at $DEPLOY_DIR"
              exit 1
            fi

            cd "$DEPLOY_DIR"

            echo "📥 Pulling latest prod branch..."
            git fetch origin prod
            git checkout prod
            git reset --hard origin/prod

            echo "📦 Installing dependencies..."
            npm install --production=false

            echo "🔨 Building production frontend..."
            VITE_API_URL=https://bansalgeo-api.geoplanetsolution.in/api npm run build

            echo "🔄 Reloading PM2 backend service..."
            if pm2 describe bansalgeo-api > /dev/null 2>&1; then
              pm2 restart bansalgeo-api --update-env
            else
              pm2 start server/server.js --name "bansalgeo-api"
            fi
            pm2 save

            echo "🌐 Reloading Nginx..."
            if command -v systemctl > /dev/null 2>&1; then
              sudo systemctl reload nginx || true
            fi

            echo "✅ Production deployment completed successfully!"
